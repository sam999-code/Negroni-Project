[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "negroni-porject"
version = "0.1.0"
description = "A governed AI-agent research orchestration case study."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["evolith_core", "integrations"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
